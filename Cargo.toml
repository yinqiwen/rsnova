[package]
name = "rsnova"
version = "0.2.0"
edition = "2024"
description = "A lightweight tunnel/proxy using TLS mux and QUIC"
license = "Apache-2.0"
authors = ["yinqiwen <yinqiwen@gmail.com>"]
repository = "https://github.com/yinqiwen/rsnova"
exclude = ["rsnova_linux", "docs/", "example/"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "rsnova"
path = "src/lib.rs"

[[bin]]
name = "rsnova"
path = "src/main.rs"


[dependencies]
clap = { version = "4.1.4", features = ["derive", "env"] }
clap_serde_derive = { package = "clap-serde-derive", version = "0.2" }
serde = { version = "1", features = ["derive"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
# console-subscriber = "0.4"
tokio = { version = "1.0", features = ["rt-multi-thread", "sync", "net", "io-util", "time", "macros"] }
rcgen = "0.14"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
# rustls-native-certs = "0.7"
anyhow = "1.0"
url = { version = "2.5.0", features = ["serde"] }
bincode = "2"
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["compat", "io", "codec", "net"] }
httparse = "1.9"
bytes = "1"
futures = "0.3"
metrics = "0.24"
metrics-util = "0.20"
time = "0.3"
pki-types = { package = "rustls-pki-types", version = "1" }
s2n-quic = "1"
socket2 = { version = "0.6.3", features = ["all"] }
cfg-if = "1.0"
lru = "0.18"
rand = "0.8"
# axum = "0.7.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_arch = "arm"))'.dependencies]
mimalloc = "0.1"

# [target.'cfg(target_env = "msvc")'.dependencies]
# mimalloc = { version = "*" }

# [target.'cfg(not(target_env = "msvc"))'.dependencies]
# tikv-jemallocator = { version = "0.6", features = [
#     "profiling",
#     "unprefixed_malloc_on_supported_platforms",
# ] }
# jemalloc_pprof = "0.6.0"


[features]
default = []

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

[[bench]]
name = "mux_bench"
harness = false
